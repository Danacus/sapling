[package]
name = "sapling-models"
version = "0.0.1"
edition = "2021"
description = "A pinned model archive on disk: URL, exact size and sha256, one download-verify-stage-rename install, and the ONNX thread count."
publish = false

[dependencies]
# `default-features = false` drops ureq's transparent gzip: an archive is pinned
# by byte size and sha256, and a decoding layer between the socket and the
# hasher is exactly what must not exist. `rustls` brings webpki-roots with it,
# so there is no system certificate store to find.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tar = "0.4"
bzip2 = "0.6"
sha2 = "0.10"
