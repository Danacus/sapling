[package]
name = "sapling-captions"
version = "0.0.1"
edition = "2021"
description = "A video's caption tracks through yt-dlp on PATH: status, list, and one track fetched as raw json3 text."
publish = false

# No process crate and no pin: `std::process::Command` over whatever yt-dlp is
# on PATH, because yt-dlp ages against YouTube in weeks.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
