[package]
name = "sapling-desktop"
version = "0.0.1"
edition = "2021"
description = "Sapling as a Tauri v2 desktop app: the persistence core over a real SQLite file, behind the same Backend protocol the browser speaks."
publish = false

[lib]
# The app lives in the library and the binary is three lines over it.
#
# `cdylib` is Android's, and the only reason it is listed: there is no
# executable on that platform: gradle packs `libsapling_desktop.so` into the
# APK and `TauriActivity` loads it and calls the `start_app` symbol
# `mobile_entry_point` generates over `run()`. The mobile template carries a
# third type, `staticlib`, which is iOS's — left out because iOS is not built
# here and it would cost every desktop check an archive of the whole dependency
# graph.
name = "sapling_desktop"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sapling-desktop"
path = "src/main.rs"

[features]
# On by default: a desktop build without it has neither a neural voice nor
# dictation, because WebKitGTK can run neither the browser's sherpa-onnx WASM
# path (no `SharedArrayBuffer`, and a 439 MB Emscripten file package on top) nor
# a `SpeechRecognition` it does not have. It is a feature only so `cargo check
# -p sapling-desktop --no-default-features` can still typecheck the host on a
# machine with no sherpa toolchain.
#
# **One feature for both directions**, not `tts` and `asr`. Synthesis and
# recognition are one crate, `sapling-speech`, over one dependency set —
# sherpa-onnx, and `sapling-models`' download, checksum and unpack of a pinned
# archive — and splitting them here would make a matrix of four builds nobody
# would ever check. It was called `tts` until dictation arrived.
#
# **Enabling it does not mean the whole of speech exists.** `sapling-speech` is
# declared twice below: on every target with `tts` and `asr`, and once more for
# desktop targets with `playback` added, which is the one part that is
# rodio — there is nothing for it to do on a phone, whose WebView is Chromium
# and plays a clip perfectly well. So `lib.rs` gates the six
# synthesis/recognition commands on `feature = "speech"` and only `tts_play` and
# `tts_stop` on `all(feature = "speech", desktop)`. One `dep:` entry enables
# both declarations; resolver 2 applies a target table's features only where
# that target is being built.
default = ["speech"]
speech = ["dep:sapling-speech"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sapling-core = { path = "../sapling-core" }
# The database in the app-data directory: the file, the device id, the clock
# and the time zone. Everything but the Tauri side of it.
sapling-store = { path = "../sapling-store" }
# Synthesis and recognition on every target, phones included: they are the same
# code and the same models wherever this crate runs. Recording is not here at
# all: the WebView captures the audio on both hosts and hands it over as a raw
# IPC body.
sapling-speech = { path = "../sapling-speech", optional = true, default-features = false, features = [
	"tts",
	"asr",
] }
# `devtools` is on because this is a spike and the APK CI hands out is now a
# *release* build: without it a release webview has no inspector at all, and the
# only way anyone here sees a console on the phone is `chrome://inspect` over
# adb — the feature is exactly what gates wry's `setWebContentsDebuggingEnabled`
# on Android (and `open_devtools` on the desktop window). **It comes off when
# the app is distributed**: it leaves a shipped build inspectable by anyone with
# a cable, and on macOS it reaches for private APIs the App Store rejects.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# -- Playback and captions are desktop capabilities ---------------------------
#
# This is the whole of what a phone does differently. `playback` is rodio,
# which exists because *WebKitGTK* cannot play a clip without a second of
# latency per word and its Web Audio output is unusable
# (`crates/sapling-speech/src/tts/play.rs` has the measurements); Android's
# WebView is Chromium, where `<audio>` over a blob is the ordinary path and
# works. `sapling-captions` runs yt-dlp off PATH, and a phone has neither. So
# both are target-scoped here, `tts_play`/`tts_stop` and the three caption
# commands are gated on `desktop`, and everything else is one configuration on
# every target. `desktop` is Tauri's own cfg alias (`tauri_build::build()` emits
# it) and means exactly this table's condition — which is why the condition is
# spelled here and not in the crates, which cannot see the alias.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sapling-speech = { path = "../sapling-speech", optional = true, default-features = false, features = [
	"tts",
	"asr",
	"playback",
] }
sapling-captions = { path = "../sapling-captions" }

# -- One Linux-only dependency, and it is a permission prompt ----------------
#
# WebKitGTK has no permission UI of its own: it emits `permission-request` on
# the `WebKitWebView` and **denies** the request when nothing handles the
# signal. wry connects WebGL, WebAudio and the clipboard settings and not that
# signal, and Tauri connects nothing, so `getUserMedia` on this webview fails
# with `NotAllowedError` and there is no browser setting a learner could change
# — see `src/permissions.rs`. Answering it needs the `WebKitWebView` behind
# `with_webview`, which is this crate.
#
# **Pinned `=2.0.2`, which is what Tauri 2.11.5 already locks** (via
# `tauri-runtime-wry` and wry, both `=2.0`): `PlatformWebview::inner()` hands
# back a `webkit2gtk::WebView` from *their* copy of the crate, and two
# semver-compatible versions would be two unrelated types. `v2_40` is
# `tauri-runtime-wry`'s own feature set for it, so nothing new is unified in —
# the two properties read here arrive with it (`is-for-audio-device` at v2_8,
# `enable-media-stream` at v2_4).
#
# Android is unaffected and never sees this table: wry's own
# `RustWebChromeClient.onPermissionRequest` answers the WebView there, over the
# permissions the committed `AndroidManifest.xml` declares.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
