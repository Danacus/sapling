[package]
name = "sapling-desktop"
version = "0.0.1"
edition = "2021"
description = "Sapling as a Tauri v2 desktop app: the persistence core over a real SQLite file, behind the same Backend protocol the browser speaks."
publish = false

[lib]
# The host lives in the library so `tests/` can open it without a webview; the
# binary is three lines over it.
name = "sapling_desktop"
crate-type = ["lib"]

[[bin]]
name = "sapling-desktop"
path = "src/main.rs"

[features]
# On by default: a desktop build without it has no neural voice at all, because
# WebKitGTK cannot run the browser's sherpa-onnx WASM path (no
# `SharedArrayBuffer`, and a 439 MB Emscripten file package on top). It is a
# feature only so `cargo check -p sapling-desktop --no-default-features` can
# still typecheck the host on a machine with no sherpa toolchain.
default = ["tts"]
tts = ["dep:sherpa-rs-sys", "dep:ureq", "dep:tar", "dep:bzip2", "dep:sha2", "dep:hound"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sapling-core = { path = "../sapling-core", features = ["sqlite"] }
tauri = { version = "2", features = [] }
# The host opens the file, so it needs the driver the core's adapter wraps.
# The version must match `sapling-core`'s or two SQLite builds link at once.
rusqlite = { version = "0.40", features = ["bundled"] }
# `localDay` is the only place a time zone exists (see `core.md`), and on a
# desktop that zone is the operating system's.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# -- The native voice (`tts` feature) ----------------------------------------
#
# The bindings, not the `sherpa-rs` wrapper over them: that wrapper's Kokoro
# constructor frees the rule-FST path string before sherpa-onnx reads it, and
# the FSTs are not optional here. `src/tts/kokoro.rs` says the whole story.
#
# `download-binaries` fetches k2-fsa's own prebuilt shared libraries for the
# exact sherpa-onnx tag whose headers this crate vendors. It is the only
# combination whose ABI is guaranteed: nixpkgs ships a *newer* sherpa-onnx whose
# `SherpaOnnxOfflineTtsModelConfig` has three more members, so linking the
# nixpkgs library against these bindings would silently misread the config.
sherpa-rs-sys = { version = "0.6.8", optional = true, features = [
	"download-binaries",
	"tts",
] }
# The model download. `default-features = false` drops ureq's transparent gzip:
# the archive is pinned by byte size and sha256, and a decoding layer between
# the socket and the hasher is exactly what must not exist. `rustls` brings
# webpki-roots with it, so there is no system certificate store to find.
ureq = { version = "3", optional = true, default-features = false, features = [
	"rustls",
] }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.6", optional = true }
sha2 = { version = "0.10", optional = true }
# The RIFF/WAVE container `tts_synthesize` answers with. Pure Rust, no unsafe,
# no dependencies of its own, and it writes into an in-memory `Cursor` — so the
# byte layout is a library's problem rather than ours (`src/tts/wav.rs`).
hound = { version = "3.5", optional = true }
