[package]
name = "sapling-core"
version = "0.1.0"
edition = "2021"
description = "Sapling's persistence core: the event log, its merge rules, the SRS and the backend surface, over a SQLite seam."
publish = false

[features]
default = []
# An `Sql` over rusqlite's bundled SQLite. The crate never opens a database on
# its own; this is the adapter native hosts and the crate's own tests use.
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` so an object round-trips with its keys where JavaScript put them.
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
# FSRS itself, from the team that also writes ts-fsrs. `default-features = false`
# is not worth spelling: the only default feature is the experimental cost model,
# and turning it off still leaves `rand`/`rayon` in the tree (neither is reachable
# from `next_states`).
fsrs = "6.6.2"
# Never called: `fsrs` pulls `rand` in for its optimizer, `rand` pulls `getrandom`,
# and `getrandom` refuses to compile for wasm32 until something turns this feature
# on. A direct dependency is how a leaf crate's feature gets unified in.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# The crate's tests need the adapter; this is how a crate turns on its own feature.
sapling-core = { path = ".", features = ["sqlite"] }
