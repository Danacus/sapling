[package]
name = "sapling-store"
version = "0.0.1"
edition = "2021"
description = "Sapling's database in a directory: sapling-core over a SQLite file, with the device id, the system clock and the system time zone a native host lends it."
publish = false

[dependencies]
sapling-core = { path = "../sapling-core", features = ["sqlite"] }
# The store opens the file, so it needs the driver the core's adapter wraps.
# The version must match `sapling-core`'s or two SQLite builds link at once.
rusqlite = { version = "0.40", features = ["bundled"] }
# `localDay` is the only place a time zone exists (see `core.md`), and on a
# native host that zone is the operating system's.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
