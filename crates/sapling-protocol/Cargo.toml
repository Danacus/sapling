[package]
name = "sapling-protocol"
version = "0.1.0"
edition = "2021"
description = "Sapling's Backend protocol by name: a method name and a JSON argument array in, a JSON answer out, over sapling-db's Core."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` so an object round-trips with its keys where its writer put them.
serde_json = { version = "1", features = ["preserve_order"] }
sapling-challenges = { path = "../sapling-challenges" }
sapling-db = { path = "../sapling-db" }
sapling-domain = { path = "../sapling-domain" }
sapling-import = { path = "../sapling-import" }
sapling-llm = { path = "../sapling-llm" }
sapling-sync = { path = "../sapling-sync" }
# The TypeScript side of the wire is generated from these types (`pnpm core:types`,
# see `sapling-protocol`'s `typescript` tests). The derive is inert outside that.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
pollster = "0.4"
# `FsrsCardState` is declared in the generated TypeScript although no method
# names it: `KnowledgeItem.fsrsCard` is opaque there, and the words ledger reads it.
sapling-srs = { path = "../sapling-srs" }
