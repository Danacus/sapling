# Build and deploy the static app; check the desktop host beside it.
#
# `build`: one job, every web gate, then a deploy step that only runs for a
# push to `main`. Everything executes inside the flake's devShell, so CI uses
# the exact node, pnpm, cargo, lld and wasm-bindgen the checkout pins —
# Cloudflare Pages' own build image has no Rust, which is why the build lives
# here and the Pages git integration is switched off (see .claude/rules/deploy.md).
#
# `desktop`: `pnpm desktop:check` (clippy + the crate's tests) in the second
# devShell, which is the only one that provides WebKitGTK. It runs alongside
# `build` and does not gate the deploy: the web artifact has no dependency on
# the crate, so a red desktop check says a protocol change broke the host, not
# that the site is wrong — it fails the commit, not the deploy.
#
# `android`: the *same* crate, built as a sideloadable **release** APK and
# uploaded as a workflow artifact — a spike, and the only place that build
# exists, since nobody here has an Android SDK. It is signed with a stable key
# held in the four `ANDROID_*` secrets below, so each APK installs over the last
# one instead of demanding an uninstall; with no keystore secret (a fork, a pull
# request from one) the signing step is skipped and Gradle's debug key signs it
# instead, which still installs and still cannot update a properly signed build.
# It reads the same two build-time variables the web build does and is fine with
# neither set. Two things about it are deliberate and both are in
# docs/desktop.md: the web bundle is built first under nix (that is where
# wasm-bindgen and lld live) and Tauri's `beforeBuildCommand` is overridden away
# so it is not built a second time under a toolchain that has neither; and
# **the Rust half uses rustup, not nix**,
# because nixpkgs' rustc carries no Android target std and `androidenv` is unfree
# and enormous. So only `cargo`/`rustc` come from outside the devShell — node,
# pnpm and everything else are still the flake's. That toolchain is bare — no
# libclang, in particular — and nothing needs one: `sherpa-onnx-sys` ships
# pregenerated bindings and runs no bindgen. It does download k2-fsa's Android
# libraries, into the `target/` this job already caches. Like `desktop`, it runs
# alongside `build` and gates nothing: the site does not ship in an APK.
#
# The embed page (`embed/`) is a *third* artifact and its own Pages project. It
# is the one document that talks to YouTube's IFrame API on behalf of the
# desktop shell, which serves the app from `tauri://localhost` and therefore has
# no referer YouTube will accept (error 153, .claude/rules/media.md). It must be
# on an origin of its own — it is deliberately frameable — so it is built here
# and uploaded separately, and the step is skipped entirely when no project is
# configured for it. Its build runs on every PR regardless, so a page that no
# longer compiles fails the commit.
#
# Needs, set once in the repository settings:
#   secrets  CLOUDFLARE_API_TOKEN     token with Cloudflare Pages: Edit
#            CLOUDFLARE_ACCOUNT_ID
#            ANDROID_KEYSTORE_BASE64  the APK signing keystore, `base64 -w0` of
#                                     the .jks; unset means a debug-signed APK
#            ANDROID_KEYSTORE_PASSWORD
#            ANDROID_KEY_ALIAS        `sapling`
#            ANDROID_KEY_PASSWORD     equal to the store password (PKCS12)
#   vars     CLOUDFLARE_PAGES_PROJECT the Pages project name (defaults to `sapling`)
#            VITE_SYNC_URL            the sync Worker's URL; unset builds without sync
#            CLOUDFLARE_PAGES_EMBED_PROJECT  the embed page's own Pages project;
#                                     unset means it is never deployed
#            VITE_YOUTUBE_EMBED_URL   the deployed embed page's full URL, e.g.
#                                     https://embed.example.org/youtube.html;
#                                     read by desktop builds only
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # A superseded PR run is wasted work; a superseded main run is a deploy
  # that must be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Cache the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Rust gates
        run: |
          nix develop -c pnpm core:check
          nix develop -c pnpm core:test

      - name: TypeScript gates
        run: |
          nix develop -c pnpm check
          nix develop -c pnpm test
          nix develop -c pnpm format:check

      - name: Build
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
          VITE_YOUTUBE_EMBED_URL: ${{ vars.VITE_YOUTUBE_EMBED_URL }}
        run: |
          nix develop -c pnpm build
          nix develop -c pnpm embed:build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sapling' }}
        run: nix develop -c pnpm exec wrangler pages deploy build --project-name "$PROJECT" --branch main

      # A separate origin, so a separate project — there is no default name to
      # fall back to, and no reason to invent one: a repository that has not
      # configured this simply does not have an embed page, and the desktop
      # build says so in the video's place.
      - name: Deploy the embed page to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_EMBED_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMBED_PROJECT: ${{ vars.CLOUDFLARE_PAGES_EMBED_PROJECT }}
        run: nix develop -c pnpm exec wrangler pages deploy embed/dist --project-name "$EMBED_PROJECT" --branch main

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Its own key: the desktop shell adds WebKitGTK, GTK and GStreamer to the
      # store, which the web job's cache never holds.
      - name: Cache the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-desktop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-desktop-${{ runner.os }}-
          gc-max-store-size-linux: 6G

      # Its own `target` too: the crate links a different set of libraries.
      # This also carries the sherpa-onnx libraries — `sherpa-onnx-sys`'s build
      # script downloads the prebuilt archive for its pinned tag into
      # `target/sherpa-onnx-prebuilt/`, so no second cache step is needed and a
      # `Cargo.lock` bump (which is where the tag lives) refetches it.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-desktop-${{ runner.os }}-

      # No `pnpm install` and no site build: `desktop:check` is cargo only, and
      # `tauri::generate_context!` accepts a missing `frontendDist` (verified:
      # the crate checks with no `build/` at all).
      - name: Desktop gates
        run: nix develop .#desktop -c pnpm desktop:check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # The *default* devShell — the same one `build` uses, so the same key
      # rather than a second copy of identical store paths. Whichever of the two
      # jobs gets there first saves it.
      - name: Cache the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # Its own, unlike the two above: this is a fourth target set
      # (`aarch64-linux-android`), built by a toolchain no other job uses. It
      # also carries the ~45 MB sherpa-onnx Android archive, which
      # `sherpa-onnx-sys` downloads into `target/sherpa-onnx-prebuilt/` — no
      # separate cache step for it, and a `Cargo.lock` bump (which is where the
      # sherpa tag lives) refetches.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      # For Gradle, not for the app: the Android Gradle Plugin the generated
      # project asks for needs a JDK 17 or newer.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The one piece that cannot come from the flake (see the header). Only the
      # `aarch64` target is installed because only that ABI is built — see the
      # APK step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Everything this job needs to find, found once and loudly: a missing NDK
      # or a cargo without the Android target should fail here, in four lines of
      # log, rather than twenty minutes into a Gradle run.
      - name: Locate the toolchain, the NDK and the SDK
        run: |
          set -x
          # Remembered because `nix develop` puts its own cargo in front of
          # rustup's shims, and nixpkgs' rustc has no Android std at all.
          echo "RUSTUP_BIN=$(dirname "$(command -v cargo)")" >> "$GITHUB_ENV"
          # The runner image ships an NDK, so nothing is downloaded here;
          # `NDK_HOME` is the variable the Tauri CLI reads. If the image ever
          # stops shipping one, `nttld/setup-ndk` is the replacement for this.
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          test -d "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          cat "$ndk/source.properties"
          # The two the generated `app/build.gradle.kts` names by number
          # (`compileSdk = 36`). Already present on the image, in which case this
          # is a no-op — but an auto-download half-way through a Gradle run is
          # not something to leave to chance.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          # `apksigner` lives in the build-tools that were just installed, and
          # the signature check at the end of the job is the only caller.
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          cargo --version
          rustc --version
          rustup target list --installed
          java -version

      - name: Install
        run: nix develop -c pnpm install --frozen-lockfile

      # Inside the devShell, and before Tauri is asked for anything: `pnpm build`
      # runs `core:wasm`, which needs the wasm32 target, `lld` and the exact
      # pinned wasm-bindgen — none of which exist outside the flake. The APK step
      # then tells Tauri not to build it again.
      - name: Build the web bundle
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
          VITE_YOUTUBE_EMBED_URL: ${{ vars.VITE_YOUTUBE_EMBED_URL }}
        run: nix develop -c pnpm build

      # `gen/android` is committed — it carries the app's icons and the
      # edge-to-edge fix, which exist only as edits to the generated project
      # (docs/desktop.md). This job must never regenerate it: `tauri android
      # init` writes Tauri's own defaults back over both, and the APK would
      # come out with a launcher icon nobody chose and the status bar over the
      # top of the app. So the step checks instead of generating.
      - name: Check the Android project is present
        run: |
          test -d crates/sapling-desktop/gen/android || {
            echo "crates/sapling-desktop/gen/android is missing." >&2
            echo "It is committed, not generated here — see docs/desktop.md." >&2
            exit 1
          }

      # The signing key, out of the secrets and into the two files Gradle reads.
      # The check is inside the shell rather than an `if:` on the step because
      # the `secrets` context is not available in a step condition — and an
      # absent keystore is not an error: `app/build.gradle.kts` falls back to
      # the debug key and says so, so a fork still gets an installable APK.
      # `keystore.properties` is gitignored and `storeFile` is relative to
      # gen/android, which is where the .jks is written beside it.
      - name: Write the Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gen=crates/sapling-desktop/gen/android
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — this APK will be debug-signed (docs/desktop.md)."
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$gen/sapling-upload.jks"
          {
            echo "storeFile=sapling-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > "$gen/keystore.properties"

      # Gradle calls the Tauri CLI back per ABI (`pnpm tauri android
      # android-studio-script`), so pnpm, node and rustup's cargo all have to be
      # on the PATH this inherits — which is exactly why the prepend happens
      # inside the devShell rather than around it. The quotes are single on
      # purpose: `$PATH` must be the one nix has just set, not the one out here.
      - name: Build the release APK
        run: nix develop -c bash -c 'set -x; PATH="$RUSTUP_BIN:$PATH" pnpm desktop:android'

      # The voice's own gate. `crates/sapling-desktop/build.rs` copies
      # sherpa-onnx's two Android `.so` files into the project's `jniLibs/`
      # during the cargo build, because nothing else does — Tauri's Gradle
      # plugin packages exactly one library, the crate's own. Whether a build
      # script ran is cargo's business, so what is checked here is the *APK*:
      # a phone that installed a voiceless one would be a much later discovery.
      # The `readelf` list is printed because it is the answer to "does this
      # also need libc++_shared?" — it does not, and that is a fact about these
      # binaries rather than a thing to assume.
      - name: Check sherpa-onnx reached the APK
        run: |
          set -eu
          apk=crates/sapling-desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          jni=crates/sapling-desktop/gen/android/app/src/main/jniLibs/arm64-v8a
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          echo "--- $jni"
          ls -l "$jni" || echo "(the build script wrote nothing here)"
          for so in "$jni"/*.so; do
            [ -f "$so" ] || continue
            echo "--- $so"
            "$readelf" -d "$so" | grep -E 'NEEDED|SONAME' || true
          done
          echo "--- $apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/' || true
          for lib in libsapling_desktop.so libsherpa-onnx-c-api.so libonnxruntime.so; do
            unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib" || {
              echo "$lib is not in the APK — the voice would fail on the phone." >&2
              echo "See crates/sapling-desktop/build.rs and docs/desktop.md." >&2
              exit 1
            }
          done

      # The gate on all of the above: an APK that came out unsigned fails here,
      # and `--print-certs` names the certificate in the log, so which key signed
      # it is a fact rather than an assumption. A debug-signed fallback build
      # passes too — it is signed, just not with ours, and the printed subject
      # says `CN=Android Debug`.
      - name: Verify the APK's signature
        run: |
          set -x
          apksigner verify --print-certs \
            crates/sapling-desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: sapling-android-apk
          path: crates/sapling-desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
