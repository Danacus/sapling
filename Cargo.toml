[workspace]
members = [
	"crates/sapling-srs",
	"crates/sapling-domain",
	"crates/sapling-import",
	"crates/sapling-challenges",
	"crates/sapling-sync",
	"crates/sapling-taal",
	"crates/sapling-llm",
	"crates/sapling-db",
	"crates/sapling-protocol",
	"crates/sapling-wasm",
	"crates/sapling-store",
	"crates/sapling-models",
	"crates/sapling-speech",
	"crates/sapling-ocr",
	"crates/sapling-captions",
	"crates/sapling-media",
	"crates/sapling-desktop",
]
# `pnpm core:test` and `pnpm core:check` are a bare `cargo test` / `cargo clippy
# --all-targets` at the root, in the *default* shell, so a default member is a
# crate that builds there.
#
# Only `sapling-desktop` and `sapling-media` are left out, and reached with
# `-p` instead (`pnpm desktop:check` does): they link WebKitGTK and GStreamer,
# which only the `desktop` devShell provides. `sapling-speech` is in with its default features, `tts` and `asr`:
# `sherpa-onnx-sys` fetches its prebuilt static library into `target/` at build
# time, which needs nothing the default shell lacks — and so is `sapling-ocr`,
# which links that same library's ONNX Runtime. Its `playback` feature
# (rodio, which wants `alsa-lib`) is not a default, and nothing among the
# default members turns it on, so feature unification cannot pull ALSA in here;
# `desktop:check` builds it alongside `sapling-desktop`, which does.
default-members = [
	"crates/sapling-srs",
	"crates/sapling-domain",
	"crates/sapling-import",
	"crates/sapling-challenges",
	"crates/sapling-sync",
	"crates/sapling-taal",
	"crates/sapling-llm",
	"crates/sapling-db",
	"crates/sapling-protocol",
	"crates/sapling-wasm",
	"crates/sapling-store",
	"crates/sapling-models",
	"crates/sapling-speech",
	"crates/sapling-ocr",
	"crates/sapling-captions",
]
resolver = "2"

# The release profile is what the wasm build ships; size is what matters there.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
