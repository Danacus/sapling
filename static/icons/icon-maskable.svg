<!--
  Maskable variant of icon.svg: Android crops maskable icons to an arbitrary
  shape (circle, squircle, teardrop), so the background bleeds to the edges
  and the artwork is scaled to ~64% about the centre — comfortably inside the
  80% safe zone that the spec guarantees will survive any mask. No hairline
  edge here: the mask would crop it into an arc.

  Rasterise with:  resvg icon-maskable.svg icon-maskable-512.png -w 512 -h 512
  apple-touch-icon.png is this file at full artwork scale (iOS only rounds the
  corners, so the art keeps icon.svg's own margins):
    resvg apple-touch.svg apple-touch-icon.png -w 180 -h 180
  where apple-touch.svg is this file with the scale group removed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#f4efe4" />
  <g transform="translate(256 256) scale(0.64) translate(-256 -256)">
    <path d="M256 318 C 256 284 252 254 256 226" stroke="#3c7030" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M252 238 C 206 242 158 220 144 148 C 220 148 254 188 252 238 Z" fill="#4f8c3d" />
    <path d="M260 238 C 306 242 354 220 368 148 C 292 148 258 188 260 238 Z" fill="#4f8c3d" />
    <rect x="150" y="312" width="212" height="40" rx="14" fill="#c96a3b" />
    <path d="M176 364 L 336 364 L 314 434 Q 309 452 290 452 L 222 452 Q 203 452 198 434 Z" fill="#c96a3b" />
  </g>
</svg>
