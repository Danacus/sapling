<!--
  Maskable variant of icon.svg: Android crops maskable icons to an arbitrary
  shape (circle, squircle, teardrop), so the background bleeds to the edges and
  the artwork is scaled to ~64% about the centre — comfortably inside the 80%
  safe zone that the spec guarantees will survive any mask.

  Rasterise with:  resvg icon-maskable.svg icon-maskable-512.png -w 512 -h 512
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#58cc02" />
  <g transform="translate(256 256) scale(0.64) translate(-256 -256)">
    <path
      d="M148 120h216a52 52 0 0 1 52 52v128a52 52 0 0 1-52 52H244l-72 62a12 12 0 0 1-20-9v-53h-4a52 52 0 0 1-52-52V172a52 52 0 0 1 52-52z"
      fill="#ffffff" />
    <rect x="152" y="189" width="208" height="30" rx="15" fill="#58cc02" />
    <rect x="152" y="253" width="136" height="30" rx="15" fill="#58cc02" />
  </g>
</svg>
