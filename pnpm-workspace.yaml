# pnpm settings — records the dependency build-script decisions pnpm ≥10
# demands. A package with an *undecided* build script is only a warning
# locally, but Cloudflare Pages' CI install hard-fails on it
# (ERR_PNPM_IGNORED_BUILDS), so the decision must live in the repo.
#
# esbuild is denied on purpose: its platform binary arrives via
# optionalDependencies and the postinstall is only a sanity check — vite
# builds fine without it, locally and on CF.
#
# The other two arrive under LiveStore and are denied for the same reason:
# both are optional *native* accelerations with working pure-JS fallbacks,
# and neither is reachable from the browser bundle CF actually builds.
#   - @parcel/watcher — dev-time file watching (falls back to polling).
#   - msgpackr-extract — native msgpack decode; msgpackr ships a JS path.
#
# workerd is the exception, and allowed on purpose: it is the Cloudflare
# runtime `wrangler dev` executes the sync Worker in, and unlike the three
# above it has no fallback — denying its postinstall leaves no binary to run,
# so the only way to exercise the sync backend locally would be to deploy it.
# The cost is one platform binary download in CF Pages' install, which does not
# need it. If that install time ever matters more than a local sync backend,
# this is the line to flip.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  msgpackr-extract: false
  workerd: true
